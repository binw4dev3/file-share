server.port=${PORT:8080}
server.servlet.context-path=/api

spring.application.name=partneros-api
spring.jackson.default-property-inclusion=non_null
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/partneros}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

partneros.upstream-base-url=${PARTNEROS_UPSTREAM_BASE_URL:http://localhost:8082}
partneros.client-id=${PARTNEROS_CLIENT_ID:}
partneros.client-secret=${PARTNEROS_CLIENT_SECRET:}
partneros.scope=${PARTNEROS_SCOPE:}
partneros.connect-timeout-ms=${PARTNEROS_CONNECT_TIMEOUT_MS:5000}
partneros.read-timeout-ms=${PARTNEROS_READ_TIMEOUT_MS:10000}
partneros.token-refresh-skew-seconds=${PARTNEROS_TOKEN_REFRESH_SKEW_SECONDS:60}
partneros.persistence.enabled=${MONGODB_ENABLED:false}

springdoc.show-actuator=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.path=/v3/api-docs
